name: Build, Test, and Release Rust Stage1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-stage1-release
  cancel-in-progress: false

env:
  TEST_REPOSITORY: nushell/nushell

jobs:
  prepare:
    name: Prepare versions
    runs-on: ubuntu-24.04
    outputs:
      rust-version: ${{ steps.versions.outputs.rust-version }}
      release-tag: ${{ steps.versions.outputs.release-tag }}
      release-title: ${{ steps.versions.outputs.release-title }}
      test-revision: ${{ steps.versions.outputs.test-revision }}
    steps:
      - name: Checkout LLVM
        uses: actions/checkout@v6

      - name: Read LLVM version
        id: llvm-version
        uses: ./.github/workflows/get-llvm-version

      - name: Resolve Rust and test revisions
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
          LLVM_VERSION: ${{ steps.llvm-version.outputs.full-no-suffix }}
        shell: bash
        run: |
          set -euo pipefail

          rust_version=$(gh release view --repo rust-lang/rust --json tagName --jq .tagName)
          test_revision=$(git ls-remote "https://github.com/$TEST_REPOSITORY.git" HEAD | cut -f1)

          [[ "$rust_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid Rust version: $rust_version" >&2
            exit 1
          }
          [[ "$LLVM_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid LLVM version: $LLVM_VERSION" >&2
            exit 1
          }
          [[ "$test_revision" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Invalid test revision: $test_revision" >&2
            exit 1
          }

          echo "rust-version=$rust_version" >> "$GITHUB_OUTPUT"
          echo "release-tag=R${rust_version//./}-L${LLVM_VERSION//./}" >> "$GITHUB_OUTPUT"
          echo "release-title=Rust $rust_version" >> "$GITHUB_OUTPUT"
          echo "test-revision=$test_revision" >> "$GITHUB_OUTPUT"

  build-toolchain:
    name: Build · ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    env:
      RUST_VERSION: ${{ needs.prepare.outputs.rust-version }}
      TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout LLVM
        uses: actions/checkout@v6

      - name: Clone Rust
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$RUST_VERSION" \
            https://github.com/rust-lang/rust.git rust

      - name: Remove Rust features dropped by LLVM 23
        working-directory: rust
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '"amx-tf32"' compiler/rustc_target/src/target_features.rs; then
            curl -fsSL --retry 3 https://github.com/rust-lang/rust/commit/1a56799fef3e4746385da26590928c54a39520ca.patch -o amx-tf32-compiler.patch
            curl -fsSL --retry 3 https://github.com/rust-lang/rust/commit/f7a6c996c5618a071ce07f7b29599dced5b52c50.patch -o amx-tf32-stdarch.patch
            sha256sum -c <<'EOF'
          dcdd0ba275bd4ce7521f613ac7fbca901303ee0fd3e8515c13dfa207c20820c2  amx-tf32-compiler.patch
          3ad63bcfff0eb086c59d1be5b178ef7e3e0806be646aea2fbb5429eba9abc236  amx-tf32-stdarch.patch
          EOF
            git apply --check amx-tf32-compiler.patch amx-tf32-stdarch.patch
            git apply amx-tf32-compiler.patch amx-tf32-stdarch.patch
          fi

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build zip

      - name: Build and install LLVM · Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S llvm -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/build/Release" \
            -DLLVM_ENABLE_PROJECTS="" \
            -DLLVM_TARGETS_TO_BUILD=X86 \
            -DLLVM_INSTALL_UTILS=ON \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_BUILD_TESTS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_BUILD_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_ENABLE_BACKTRACES=OFF \
            -DLLVM_BUILD_DOCS=OFF \
            -DBUILD_SHARED_LIBS=OFF
          cmake --build build --target install --parallel

      - name: Build and install LLVM · Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          cmake -S llvm -B build -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_INSTALL_PREFIX="%GITHUB_WORKSPACE%/build/Release" ^
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded ^
            -DLLVM_ENABLE_PROJECTS="" ^
            -DLLVM_TARGETS_TO_BUILD=X86 ^
            -DLLVM_INSTALL_UTILS=ON ^
            -DLLVM_INCLUDE_TESTS=OFF ^
            -DLLVM_BUILD_TESTS=OFF ^
            -DLLVM_INCLUDE_BENCHMARKS=OFF ^
            -DLLVM_BUILD_BENCHMARKS=OFF ^
            -DLLVM_INCLUDE_EXAMPLES=OFF ^
            -DLLVM_ENABLE_BACKTRACES=OFF ^
            -DLLVM_BUILD_DOCS=OFF ^
            -DBUILD_SHARED_LIBS=OFF
          cmake --build build --target install --parallel

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Configure Rust
        working-directory: rust
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            llvm_config="$(cygpath -m "$GITHUB_WORKSPACE")/build/Release/bin/llvm-config.exe"
          else
            llvm_config="$GITHUB_WORKSPACE/build/Release/bin/llvm-config"
          fi

          cat > config.toml <<EOF
          change-id = 999999

          [llvm]
          targets = "X86"
          download-ci-llvm = false
          link-shared = false
          ninja = true

          [build]
          build = "$TARGET"
          host = ["$TARGET"]
          target = ["$TARGET"]
          extended = false
          submodules = true

          [target.$TARGET]
          llvm-config = "$llvm_config"
          EOF

      - name: Build Rust stage1
        working-directory: rust
        shell: bash
        run: python3 x.py build --stage 1

      - name: Archive Rust stage1
        shell: bash
        run: |
          set -euo pipefail
          cd "rust/build/$TARGET"
          find stage1 -type l -delete
          find stage1 -type d -empty -delete

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            7z a -tzip "$GITHUB_WORKSPACE/$TARGET.zip" stage1
          else
            zip -qr "$GITHUB_WORKSPACE/$TARGET.zip" stage1
          fi

      - name: Upload Rust stage1
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target }}
          path: ${{ github.workspace }}/${{ matrix.target }}.zip
          if-no-files-found: error
          retention-days: 1

  build-baseline:
    name: Build size baseline
    needs: prepare
    runs-on: ubuntu-24.04
    env:
      RUST_VERSION: ${{ needs.prepare.outputs.rust-version }}
      RUSTC_BOOTSTRAP: 1
    steps:
      - name: Checkout test project
        uses: actions/checkout@v6
        with:
          repository: ${{ env.TEST_REPOSITORY }}
          ref: ${{ needs.prepare.outputs.test-revision }}

      - name: Install matching standard Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal

      - name: Build with standard Rust
        run: cargo +"$RUST_VERSION" build --locked -p nu --bin nu

      - name: Upload baseline binary
        uses: actions/upload-artifact@v6
        with:
          name: size-baseline
          path: target/debug/nu
          if-no-files-found: error
          retention-days: 1

  test-obfuscation:
    name: Test · ${{ matrix.mode }} · ${{ matrix.flag }}
    needs:
      - prepare
      - build-toolchain
      - build-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    env:
      RUSTC_BOOTSTRAP: 1
    strategy:
      fail-fast: false
      matrix:
        mode:
          - single
          - all-except
        flag:
          - indbr
          - icall
          - indgv
          - cse
          - fla
          - cie
          - cfe
        include:
          - mode: all
            flag: all
    steps:
      - name: Checkout test project
        uses: actions/checkout@v6
        with:
          repository: ${{ env.TEST_REPOSITORY }}
          ref: ${{ needs.prepare.outputs.test-revision }}
          path: benchmark

      - name: Download self-built Rust
        uses: actions/download-artifact@v7
        with:
          name: x86_64-unknown-linux-gnu
          path: toolchain-archive

      - name: Download size baseline
        uses: actions/download-artifact@v7
        with:
          name: size-baseline
          path: baseline

      - name: Link self-built Rust
        shell: bash
        run: |
          set -euo pipefail
          unzip -q toolchain-archive/x86_64-unknown-linux-gnu.zip -d toolchain
          rustup toolchain link self-built "$GITHUB_WORKSPACE/toolchain/stage1"

      - name: Select obfuscation flags
        env:
          MODE: ${{ matrix.mode }}
          FLAG: ${{ matrix.flag }}
        shell: bash
        run: |
          set -euo pipefail
          flags=(indbr icall indgv cse fla cie cfe)
          rustflags=(-Cllvm-args=--irobf)

          for flag in "${flags[@]}"; do
            if [[ "$MODE" == all || ( "$MODE" == single && "$flag" == "$FLAG" ) || ( "$MODE" == all-except && "$flag" != "$FLAG" ) ]]; then
              rustflags+=("-Cllvm-args=--irobf-$flag")
            fi
          done

          printf 'RUSTFLAGS=%s\n' "${rustflags[*]}" >> "$GITHUB_ENV"

      - name: Build and smoke-test with self-built Rust
        timeout-minutes: 120
        working-directory: benchmark
        env:
          MODE: ${{ matrix.mode }}
          FLAG: ${{ matrix.flag }}
        shell: bash
        run: |
          set -euo pipefail
          cargo +self-built build --locked -p nu --bin nu
          target/debug/nu --help >/dev/null
          TIMEFORMAT='%3R'
          {
            time timeout 120s target/debug/nu --no-config-file --no-history \
              --commands 'def fib [n: int] { if $n < 2 { $n } else { (fib ($n - 1)) + (fib ($n - 2)) } }; fib 20' \
              > "$RUNNER_TEMP/nu-result.txt"
          } 2> "$RUNNER_TEMP/test-time-$MODE-$FLAG.txt"
          test "$(< "$RUNNER_TEMP/nu-result.txt")" = 6765

      - name: Compare binary size
        env:
          CONFIGURATION: ${{ matrix.mode }} / ${{ matrix.flag }}
        shell: bash
        run: |
          set -euo pipefail
          baseline_size=$(stat -c '%s' baseline/nu)
          self_built_size=$(stat -c '%s' benchmark/target/debug/nu)
          difference=$((self_built_size - baseline_size))

          {
            echo "### Binary size · $CONFIGURATION"
            echo
            echo '| Standard Rust | Self-built Rust | Difference |'
            echo '| ---: | ---: | ---: |'
            printf '| %s bytes | %s bytes | %+d bytes |\n' \
              "$baseline_size" "$self_built_size" "$difference"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload invocation time
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-time-${{ matrix.mode }}-${{ matrix.flag }}
          path: ${{ runner.temp }}/test-time-${{ matrix.mode }}-${{ matrix.flag }}.txt
          if-no-files-found: ignore
          retention-days: 1

  release:
    name: Create release
    if: ${{ always() && needs.prepare.result == 'success' && needs.build-toolchain.result == 'success' }}
    needs:
      - prepare
      - build-toolchain
      - test-obfuscation
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download invocation times
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: test-time-*
          path: test-times
          merge-multiple: true

      - name: Generate test results and require one passing test
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_REVISION: ${{ needs.prepare.outputs.test-revision }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --jq '.jobs[] | @json' \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
            > test-jobs.jsonl
          python3 - <<'PY'
          import json
          import math
          import os
          from pathlib import Path

          jobs = {job["name"]: job for job in map(json.loads, Path("test-jobs.jsonl").read_text().splitlines())}
          flags = ("indbr", "icall", "indgv", "cse", "fla", "cie", "cfe")
          configurations = [(mode, flag) for mode in ("single", "all-except") for flag in flags] + [("all", "all")]
          rows = []
          passed = 0
          for mode, flag in configurations:
              job = jobs.get(f"Test · {mode} · {flag}", {})
              test = next((step for step in job.get("steps", []) if step["name"] == "Build and smoke-test with self-built Rust"), {})
              result = test.get("conclusion", "skipped")
              if result == "success":
                  passed += 1
              status = "✅" if result == "success" else "❌"
              enabled = [name for name in flags if mode == "all" or (mode == "single" and name == flag) or (mode == "all-except" and name != flag)]
              rustflags = " ".join(["-Cllvm-args=--irobf"] + [f"-Cllvm-args=--irobf-{name}" for name in enabled])
              time_file = Path("test-times") / f"test-time-{mode}-{flag}.txt"
              invocation_time = "—"
              try:
                  elapsed = float(time_file.read_text().splitlines()[-1])
              except (OSError, ValueError, IndexError):
                  pass
              else:
                  if math.isfinite(elapsed) and elapsed >= 0:
                      invocation_time = f"{elapsed * 1000:.0f} ms"
              rows.append(f"| {mode} / {flag} | `{rustflags}` | {status} | {invocation_time} |")

          report = "\n".join([
              "## Obfuscation test results",
              "",
              "Set RUSTFLAGS to the arguments in a passing row. Failed rows are not verified for use.",
              "Tests cover the Linux archive. The Windows archive was built but was not smoke-tested.",
              "The test builds Nushell's nu binary with default features and the dev profile, then compares its executable size with a matching baseline.",
              "Every configuration computes only F20 with naive recursion and no cache, then checks that the result is 6765.",
              "The Fibonacci invocation has a 120-second limit and runs without user configuration or history.",
              "Time is in milliseconds and measures one F20 invocation, including executable startup, but excludes compilation.",
              "A dash means invocation time is unavailable. Timing differences alone do not prove that obfuscation occurred.",
              "Each build and smoke test has a 120-minute limit. A failed test does not block release if another test passes.",
              f"Test source: [{os.environ['TEST_REPOSITORY']}@{os.environ['TEST_REVISION']}](https://github.com/{os.environ['TEST_REPOSITORY']}/commit/{os.environ['TEST_REVISION']}).",
              f"[Workflow run](https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/attempts/{os.environ['GITHUB_RUN_ATTEMPT']}).",
              "",
              "| Configuration | RUSTFLAGS | Status | Time |",
              "| --- | --- | :---: | ---: |",
              *rows,
              "",
          ])
          Path("release-notes.md").write_text(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(report)
          if not passed:
              raise SystemExit("No obfuscation build and smoke test passed. Release blocked.")
          PY

      - name: Download Rust stage1 archives
        uses: actions/download-artifact@v7
        with:
          pattern: x86_64-*
          path: release-assets
          merge-multiple: true

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release-tag }}
          RELEASE_TITLE: ${{ needs.prepare.outputs.release-title }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --silent 2> "$RUNNER_TEMP/release-error.txt"; then
            gh release upload "$RELEASE_TAG" release-assets/*.zip \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md \
              --draft=false --prerelease=false --latest
          elif grep -q '(HTTP 404)' "$RUNNER_TEMP/release-error.txt"; then
            gh release create "$RELEASE_TAG" release-assets/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md \
              --draft=false --prerelease=false --latest
          else
            cat "$RUNNER_TEMP/release-error.txt" >&2
            exit 1
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json url,tagName,name,isDraft,isPrerelease,assets